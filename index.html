<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sach Ki Awaz - Article Interaction</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: transparent;
      font-family:
        "Noto Nastaliq Urdu",
        "Noto Sans Arabic",
        Arial,
        sans-serif;
      color: #172033;
    }

    .interaction-wrapper {
      max-width: 900px;
      margin: 0 auto;
    }

    .interaction-card {
      background: #ffffff;
      border: 1px solid #e6e9ef;
      border-radius: 18px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.07);
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid #edf0f4;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      color: #1b315b;
    }

    .status {
      font-size: 12px;
      color: #687386;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border-bottom: 1px solid #edf0f4;
    }

    .action-btn {
      border: 0;
      background: #fff;
      padding: 14px 8px;
      cursor: pointer;
      color: #445066;
      font-size: 14px;
      font-family: inherit;
      transition: 0.2s ease;
      border-left: 1px solid #edf0f4;
    }

    .action-btn:first-child {
      border-left: 0;
    }

    .action-btn:hover {
      background: #f7f9fc;
    }

    .action-btn.active {
      color: #c62828;
      background: #fff5f5;
    }

    .action-icon {
      display: block;
      font-size: 21px;
      margin-bottom: 4px;
    }

    .count {
      font-size: 12px;
      color: #7a8495;
    }

    .action-btn.active .count {
      color: #c62828;
    }

    .share-panel {
      display: none;
      padding: 14px 18px;
      background: #fafbfc;
      border-bottom: 1px solid #edf0f4;
    }

    .share-panel.show {
      display: block;
    }

    .share-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .share-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .share-btn {
      border: 1px solid #dfe4eb;
      background: white;
      border-radius: 10px;
      padding: 9px 13px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
    }

    .share-btn:hover {
      background: #f3f5f8;
    }

    .comments {
      padding: 18px;
    }

    .comments-heading {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .comment-input {
      width: 100%;
      min-height: 95px;
      resize: vertical;
      border: 1px solid #dce1e8;
      border-radius: 12px;
      padding: 12px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    .comment-input:focus {
      border-color: #496aa5;
      box-shadow: 0 0 0 3px rgba(73, 106, 165, 0.1);
    }

    .comment-submit {
      align-self: flex-start;
      border: 0;
      border-radius: 10px;
      background: #1b315b;
      color: white;
      padding: 10px 18px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
    }

    .comment-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comment {
      border: 1px solid #e5e8ee;
      border-radius: 12px;
      padding: 12px;
      background: #fcfcfd;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
    }

    .comment-user {
      font-weight: 700;
      font-size: 13px;
      color: #31415f;
    }

    .comment-date {
      font-size: 11px;
      color: #8b94a3;
    }

    .comment-text {
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .delete-comment {
      margin-top: 8px;
      border: 0;
      background: transparent;
      color: #b42318;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      padding: 0;
    }

    .empty {
      color: #8992a1;
      text-align: center;
      padding: 18px;
      font-size: 13px;
    }

    .message {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(20px);
      background: #172033;
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s ease;
      z-index: 9999;
      max-width: calc(100% - 30px);
      text-align: center;
    }

    .message.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 600px) {
      body {
        padding: 8px;
      }

      .actions {
        grid-template-columns: repeat(5, 1fr);
      }

      .action-btn {
        padding: 11px 3px;
        font-size: 11px;
      }

      .action-icon {
        font-size: 18px;
      }

      .comments {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

<div class="interaction-wrapper">

  <div class="interaction-card">

    <div class="top-bar">
      <div class="brand-title">سچ کی آواز</div>
      <div class="status" id="status">Connecting...</div>
    </div>

    <div class="actions">

      <button class="action-btn" id="likeBtn" type="button">
        <span class="action-icon">❤️</span>
        Like
        <span class="count" id="likeCount">0</span>
      </button>

      <button class="action-btn" id="commentBtn" type="button">
        <span class="action-icon">💬</span>
        Comment
        <span class="count" id="commentCount">0</span>
      </button>

      <button class="action-btn" id="shareBtn" type="button">
        <span class="action-icon">🔗</span>
        Share
      </button>

      <button class="action-btn" id="saveBtn" type="button">
        <span class="action-icon">🔖</span>
        Save
      </button>

      <button class="action-btn" type="button">
        <span class="action-icon">👁️</span>
        Views
        <span class="count" id="viewCount">0</span>
      </button>

    </div>

    <div class="share-panel" id="sharePanel">

      <div class="share-title">خبر شیئر کریں</div>

      <div class="share-buttons">

        <button class="share-btn" id="whatsappBtn" type="button">
          WhatsApp
        </button>

        <button class="share-btn" id="facebookBtn" type="button">
          Facebook
        </button>

        <button class="share-btn" id="xBtn" type="button">
          X
        </button>

        <button class="share-btn" id="copyBtn" type="button">
          Copy Link
        </button>

      </div>

    </div>

    <div class="comments" id="commentsSection">

      <div class="comments-heading">
        تبصرے
      </div>

      <div class="comment-form">

        <textarea
          id="commentInput"
          class="comment-input"
          maxlength="1000"
          placeholder="اپنا تبصرہ لکھیں..."
        ></textarea>

        <button
          id="submitComment"
          class="comment-submit"
          type="button"
        >
          تبصرہ شائع کریں
        </button>

      </div>

      <div id="commentList" class="comment-list">
        <div class="empty">تبصرے لوڈ ہو رہے ہیں...</div>
      </div>

    </div>

  </div>

</div>

<div id="message" class="message"></div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

  import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

  import {
    getFirestore,
    collection,
    doc,
    setDoc,
    deleteDoc,
    getDocs,
    getDoc,
    addDoc,
    query,
    orderBy,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


  /* =========================================================
     1. FIREBASE CONFIGURATION
     ========================================================= */

  const firebaseConfig = {

    apiKey: "AIzaSyD0CmQS7agqnG15ErAtEToD627KeDij20Q",

    authDomain:
      "sachkiawaz786.firebaseapp.com",

    projectId:
      "sachkiawaz786",

    storageBucket:
      "sachkiawaz786.firebasestorage.app",

    messagingSenderId:
      "56855864275",

    appId:
      "1:56855864275:web:2f05336386790eb16c4526"

  };


  /* =========================================================
     2. ARTICLE SETTINGS
     ========================================================= */

  const ARTICLE_ID =
    "sach-ki-awaz-news-001";


  /*
   * IMPORTANT:
   * یہاں اپنی Google Sites news article کا اصل URL ڈالیں۔
   *
   * مثال:
   * https://sites.google.com/view/sachkiawaz/...
   */

  const ARTICLE_URL =
    "PASTE_YOUR_GOOGLE_SITES_NEWS_ARTICLE_URL_HERE";


  /* =========================================================
     3. INITIALIZE FIREBASE
     ========================================================= */

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  let currentUser = null;


  /* =========================================================
     4. DOM ELEMENTS
     ========================================================= */

  const likeBtn =
    document.getElementById("likeBtn");

  const likeCount =
    document.getElementById("likeCount");

  const commentBtn =
    document.getElementById("commentBtn");

  const commentCount =
    document.getElementById("commentCount");

  const shareBtn =
    document.getElementById("shareBtn");

  const saveBtn =
    document.getElementById("saveBtn");

  const viewCount =
    document.getElementById("viewCount");

  const sharePanel =
    document.getElementById("sharePanel");

  const commentsSection =
    document.getElementById("commentsSection");

  const commentInput =
    document.getElementById("commentInput");

  const submitComment =
    document.getElementById("submitComment");

  const commentList =
    document.getElementById("commentList");

  const status =
    document.getElementById("status");

  const message =
    document.getElementById("message");


  /* =========================================================
     5. HELPERS
     ========================================================= */

  function showMessage(text) {

    message.textContent = text;

    message.classList.add("show");

    setTimeout(() => {
      message.classList.remove("show");
    }, 2500);
  }


  function getArticleUrl() {

    if (
      ARTICLE_URL &&
      !ARTICLE_URL.includes("PASTE_YOUR")
    ) {
      return ARTICLE_URL;
    }

    return document.referrer ||
           window.location.href;
  }


  function escapeHTML(value) {

    const div =
      document.createElement("div");

    div.textContent =
      value ?? "";

    return div.innerHTML;
  }


  function formatDate(timestamp) {

    if (!timestamp) {
      return "";
    }

    try {

      const date =
        timestamp.toDate();

      return date.toLocaleString(
        "ur-PK",
        {
          dateStyle: "medium",
          timeStyle: "short"
        }
      );

    } catch {

      return "";

    }

  }


  /* =========================================================
     6. AUTHENTICATION
     ========================================================= */

  onAuthStateChanged(
    auth,
    async (user) => {

      if (user) {

        currentUser =
          user;

        status.textContent =
          "Connected";

        await loadAll();

        await registerView();

      }

    }
  );


  async function startAnonymousLogin() {

    try {

      await signInAnonymously(auth);

    } catch (error) {

      console.error(
        "Authentication error:",
        error
      );

      status.textContent =
        "Connection error";

      showMessage(
        "Firebase سے connection نہیں ہو سکا۔"
      );

    }

  }


  /* =========================================================
     7. LOAD EVERYTHING
     ========================================================= */

  async function loadAll() {

    await Promise.all([
      loadLikes(),
      loadSaves(),
      loadViews(),
      loadComments()
    ]);

  }


  /* =========================================================
     8. LIKE SYSTEM
     ========================================================= */

  async function loadLikes() {

    try {

      const likesRef =
        collection(
          db,
          "articles",
          ARTICLE_ID,
          "likes"
        );

      const snapshot =
        await getDocs(likesRef);

      likeCount.textContent =
        snapshot.size;

      if (currentUser) {

        const myLikeRef =
          doc(
            db,
            "articles",
            ARTICLE_ID,
            "likes",
            currentUser.uid
          );

        const myLike =
          await getDoc(myLikeRef);

        likeBtn.classList.toggle(
          "active",
          myLike.exists()
        );

      }

    } catch (error) {

      console.error(
        "Like load error:",
        error
      );

    }

  }


  likeBtn.addEventListener(
    "click",
    async () => {

      if (!currentUser) {
        showMessage("Connecting...");
        return;
      }

      try {

        const likeRef =
          doc(
            db,
            "articles",
            ARTICLE_ID,
            "likes",
            currentUser.uid
          );

        const existing =
          await getDoc(likeRef);

        if (existing.exists()) {

          await deleteDoc(likeRef);

          likeBtn.classList.remove(
            "active"
          );

        } else {

          await setDoc(
            likeRef,
            {
              userId:
                currentUser.uid,

              createdAt:
                serverTimestamp()
            }
          );

          likeBtn.classList.add(
            "active"
          );

        }

        await loadLikes();

      } catch (error) {

        console.error(
          "Like error:",
          error
        );

        showMessage(
          "Like محفوظ نہیں ہو سکا۔"
        );

      }

    }
  );


  /* =========================================================
     9. SAVE SYSTEM
     ========================================================= */

  async function loadSaves() {

    if (!currentUser) {
      return;
    }

    try {

      const saveRef =
        doc(
          db,
          "articles",
          ARTICLE_ID,
          "saves",
          currentUser.uid
        );

      const saved =
        await getDoc(saveRef);

      saveBtn.classList.toggle(
        "active",
        saved.exists()
      );

    } catch (error) {

      console.error(
        "Save load error:",
        error
      );

    }

  }


  saveBtn.addEventListener(
    "click",
    async () => {

      if (!currentUser) {
        showMessage("Connecting...");
        return;
      }

      try {

        const saveRef =
          doc(
            db,
            "articles",
            ARTICLE_ID,
            "saves",
            currentUser.uid
          );

        const existing =
          await getDoc(saveRef);

        if (existing.exists()) {

          await deleteDoc(saveRef);

          saveBtn.classList.remove(
            "active"
          );

          showMessage(
            "خبر Save سے ہٹا دی گئی۔"
          );

        } else {

          await setDoc(
            saveRef,
            {
              userId:
                currentUser.uid,

              articleId:
                ARTICLE_ID,

              createdAt:
                serverTimestamp()
            }
          );

          saveBtn.classList.add(
            "active"
          );

          showMessage(
            "خبر Save کر دی گئی۔"
          );

        }

      } catch (error) {

        console.error(
          "Save error:",
          error
        );

        showMessage(
          "Save نہیں ہو سکا۔"
        );

      }

    }
  );


  /* =========================================================
     10. VIEW SYSTEM
     ========================================================= */

  async function registerView() {

    if (!currentUser) {
      return;
    }

    try {

      const viewRef =
        doc(
          db,
          "articles",
          ARTICLE_ID,
          "views",
          currentUser.uid
        );

      const existing =
        await getDoc(viewRef);

      if (!existing.exists()) {

        await setDoc(
          viewRef,
          {
            userId:
              currentUser.uid,

            articleId:
              ARTICLE_ID,

            createdAt:
              serverTimestamp()
          }
        );

      }

      await loadViews();

    } catch (error) {

      console.error(
        "View registration error:",
        error
      );

    }

  }


  async function loadViews() {

    try {

      const viewsRef =
        collection(
          db,
          "articles",
          ARTICLE_ID,
          "views"
        );

      const snapshot =
        await getDocs(viewsRef);

      viewCount.textContent =
        snapshot.size;

    } catch (error) {

      console.error(
        "Views load error:",
        error
      );

    }

  }


  /* =========================================================
     11. COMMENTS
     ========================================================= */

  async function loadComments() {

    try {

      const commentsRef =
        collection(
          db,
          "articles",
          ARTICLE_ID,
          "comments"
        );

      const commentsQuery =
        query(
          commentsRef,
          orderBy(
            "createdAt",
            "desc"
          )
        );

      const snapshot =
        await getDocs(
          commentsQuery
        );

      commentCount.textContent =
        snapshot.size;

      commentList.innerHTML = "";

      if (snapshot.empty) {

        commentList.innerHTML =
          '<div class="empty">ابھی کوئی تبصرہ نہیں۔ آپ پہلا تبصرہ کریں۔</div>';

        return;

      }

      snapshot.forEach(
        (docSnap) => {

          const data =
            docSnap.data();

          const comment =
            document.createElement(
              "div"
            );

          comment.className =
            "comment";

          const isOwner =
            currentUser &&
            data.userId ===
              currentUser.uid;

          comment.innerHTML = `

            <div class="comment-header">

              <div class="comment-user">
                گمنام صارف
              </div>

              <div class="comment-date">
                ${escapeHTML(
                  formatDate(
                    data.createdAt
                  )
                )}
              </div>

            </div>

            <div class="comment-text">
              ${escapeHTML(
                data.text
              )}
            </div>

          `;

          if (isOwner) {

            const deleteButton =
              document.createElement(
                "button"
              );

            deleteButton.className =
              "delete-comment";

            deleteButton.textContent =
              "تبصرہ حذف کریں";

            deleteButton.addEventListener(
              "click",
              async () => {

                try {

                  await deleteDoc(
                    doc(
                      db,
                      "articles",
                      ARTICLE_ID,
                      "comments",
                      docSnap.id
                    )
                  );

                  showMessage(
                    "تبصرہ حذف کر دیا گیا۔"
                  );

                  await loadComments();

                } catch (error) {

                  console.error(
                    error
                  );

                  showMessage(
                    "تبصرہ حذف نہیں ہو سکا۔"
                  );

                }

              }
            );

            comment.appendChild(
              deleteButton
            );

          }

          commentList.appendChild(
            comment
          );

        }
      );

    } catch (error) {

      console.error(
        "Comments load error:",
        error
      );

      commentList.innerHTML =
        '<div class="empty">تبصرے لوڈ نہیں ہو سکے۔</div>';

    }

  }


  submitComment.addEventListener(
    "click",
    async () => {

      if (!currentUser) {

        showMessage(
          "Connecting..."
        );

        return;

      }

      const text =
        commentInput.value.trim();

      if (!text) {

        showMessage(
          "براہ کرم تبصرہ لکھیں۔"
        );

        return;

      }

      if (text.length > 1000) {

        showMessage(
          "تبصرہ زیادہ سے زیادہ 1000 حروف کا ہو سکتا ہے۔"
        );

        return;

      }

      submitComment.disabled =
        true;

      try {

        await addDoc(
          collection(
            db,
            "articles",
            ARTICLE_ID,
            "comments"
          ),
          {
            userId:
              currentUser.uid,

            text:
              text,

            articleId:
              ARTICLE_ID,

            createdAt:
              serverTimestamp()
          }
        );

        commentInput.value = "";

        showMessage(
          "آپ کا تبصرہ شائع ہو گیا۔"
        );

        await loadComments();

      } catch (error) {

        console.error(
          "Comment error:",
          error
        );

        showMessage(
          "تبصرہ محفوظ نہیں ہو سکا۔"
        );

      } finally {

        submitComment.disabled =
          false;

      }

    }
  );


  /* =========================================================
     12. COMMENT BUTTON
     ========================================================= */

  commentBtn.addEventListener(
    "click",
    () => {

      commentsSection.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

      setTimeout(
        () => commentInput.focus(),
        500
      );

    }
  );


  /* =========================================================
     13. SHARE
     ========================================================= */

  shareBtn.addEventListener(
    "click",
    () => {

      sharePanel.classList.toggle(
        "show"
      );

    }
  );


  whatsappBtn.addEventListener(
    "click",
    () => {

      const url =
        getArticleUrl();
function getArticleUrl() {
  return "https://sites.google.com/view/sachkiawaz/%D9%87%D9%88%D9%85";
}

      const text =
        "سچ کی آواز کی خبر";

      window.open(
        "https://wa.me/?text=" +
        encodeURIComponent(
          text + "\n" + url
        ),
        "_blank",
        "noopener,noreferrer"
      );

    }
  );


  facebookBtn.addEventListener(
    "click",
    () => {

      const url =
        getArticleUrl();

      window.open(
        "https://www.facebook.com/sharer/sharer.php?u=" +
        encodeURIComponent(url),
        "_blank",
        "noopener,noreferrer"
      );

    }
  );


  xBtn.addEventListener(
    "click",
    () => {

      const url =
        getArticleUrl();

      const text =
        "سچ کی آواز";

      window.open(
        "https://twitter.com/intent/tweet?text=" +
        encodeURIComponent(text) +
        "&url=" +
        encodeURIComponent(url),
        "_blank",
        "noopener,noreferrer"
      );

    }
  );


  copyBtn.addEventListener(
    "click",
    async () => {

      const url =
        getArticleUrl();

      try {

        await navigator.clipboard.writeText(
          url
        );

        showMessage(
